[build]
# Webpack évite les chemins de chunks Turbopack incompatibles avec le
# paquet de fonctions Edge créé par l'adaptateur Netlify sous Windows.
command = "npm run build -- --webpack"
publish = ".next"

[build.environment]
NODE_VERSION = "24"

# Netlify détecte Next.js et applique son adaptateur pour les routes serveur.
# Les variables secrètes et SITE_URL doivent être définies dans Netlify,
# avec les portées Builds et Functions, et jamais dans ce fichier.
